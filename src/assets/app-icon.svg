<!--
  The home-screen mark. 1024x1024, one artboard — every raster size is generated
  from this file by `npm run icons`, so this is the only image to replace.

  ⚠️ PLACEHOLDER, pending 1F/C's design pass. It is spec-faithful rather than
  designed: the ember gradient is `.ember-core`'s exact three stops from
  globals.css, and the toque is lucide's ChefHat — the same path
  `chef-presence.tsx` renders — stroked at #2A1C04 / 85%, sized to 41% of the
  sphere and seated just below centre, which is what spec §02 specifies. It
  exists so the PWA can be installed and the standalone auth path tested before
  the artwork lands. See docs/design/surfaces/pwa/brief.md, artifact 1.

  Full-bleed floor, deliberately: iOS applies its own rounded-rect mask and does
  not composite transparency, so a transparent orb would arrive as a black box.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- `.ember-core`: radial-gradient(circle at 40% 34%, ...) — same stops. -->
    <radialGradient id="ember" cx="40%" cy="34%" r="72%">
      <stop offset="0%"   stop-color="#FFEEC4" stop-opacity="0.97" />
      <stop offset="46%"  stop-color="#E9B348" stop-opacity="0.92" />
      <stop offset="78%"  stop-color="#8C5F19" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#8C5F19" stop-opacity="0.16" />
    </radialGradient>
    <!-- The 44px -8px ember glow, scaled to the artboard. -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34" result="b" />
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.914  0 0 0 0 0.702  0 0 0 0 0.282  0 0 0 0.6 0" result="g" />
      <feMerge><feMergeNode in="g" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#0F0B08" />
  <!-- §01's light.ambient wash, so the icon sits on the same floor the app does. -->
  <radialGradient id="wash" cx="78%" cy="-12%" r="62%">
    <stop offset="0%" stop-color="#E9B348" stop-opacity="0.13" />
    <stop offset="100%" stop-color="#E9B348" stop-opacity="0" />
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#wash)" />

  <!-- The ember. 512px sphere on a 1024 artboard = half the width, which leaves
       the outer ~10% clear for Android's mask. -->
  <circle cx="512" cy="512" r="256" fill="url(#ember)" filter="url(#glow)" />

  <!-- The toque: a hairline stroke, never a fill. §02 sizes it to 41% of the
       sphere — 41% of 512px = 210px of DRAWN MARK, which is not 41% of the
       viewBox: lucide's path spans ~15.2 of its 24 units, so scaling the box by
       8.75 gave a 133px hat (26%). Scale against the ink, not the container:
       210 / 15.2 = 13.8. Seated just below centre so the highlight stays clear
       above the brim and the light still reads as coming from up-left.
       Stroke-width divides by the scale to keep the 1.6-on-24 hairline. -->
  <g transform="translate(512 548) scale(13.8) translate(-12 -12)"
     fill="none" stroke="#2A1C04" stroke-opacity="0.85" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z" />
    <path d="M6 17h12" />
  </g>
</svg>
