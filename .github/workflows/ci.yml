name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gauntlet:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README states Node 20 or newer; running both ends of that claim is
        # what keeps it true.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run

# Deliberately not here: the Playwright suite (needs a build and browsers, ~20
# minutes) and the eval suite (spends real money against a live model on every
# push). Both are run locally and their results committed with the change that
# produced them; `evals/freshness.test.ts` above fails the unit run if the AI
# prompts have moved on from the committed eval results.
